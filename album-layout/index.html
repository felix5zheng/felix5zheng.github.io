<title>相本自動排版</title>
<style>
/* Hallmark · shape: app screen · genre: editorial · theme: custom (imokahhhh style)
 * paper: oklch(97.2% 0.006 82) · accent: oklch(19% 0.024 52) · display: SF Pro Display · body: SF Pro Text
 * nav: glass top bar, the tool's name and one count · signature: the run of white spreads, each named like the file it becomes · states: empty, reading, error, full, exporting
 * axes: light/grotesk-sans/neutral · posture: Restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V3 · weakest: V, the house tokens are shared with every imokahhhh page by the owner's rule; the strip of spreads named 002-003 is what only this tool has */
/* Hallmark · waive 29 · one glass bar, the nav, over a paper ground · the frosted nav is the imokahhhh house bar and the spreads scroll beneath it */
:root {
  color-scheme: light;
  --color-paper: oklch(97.2% 0.006 82);
  --color-band: oklch(93.6% 0.011 76);
  --color-card: oklch(99% 0.004 82);
  --color-tile: oklch(90.5% 0.013 74);
  --color-ink: oklch(19% 0.024 52);
  --color-ink-2: oklch(31% 0.018 54);
  --color-muted: oklch(46% 0.014 60);
  --color-hairline: oklch(83% 0.011 70);
  --color-focus: var(--color-ink);
  --color-accent: var(--color-ink);
  --color-sheet: oklch(99.6% 0.003 82);
  --color-demo-a: oklch(74% 0.045 62);
  --color-demo-b: oklch(66% 0.04 150);
  --color-demo-c: oklch(70% 0.04 235);
  --color-demo-d: oklch(62% 0.05 28);
  --color-demo-e: oklch(58% 0.035 300);
  --color-demo-f: oklch(78% 0.05 95);
  --color-demo-ink: oklch(99% 0.004 82);
  --nav-glass: oklch(97.2% 0.006 82 / 0.8);
  --ring: 0 0 0 1px oklch(19% 0.024 52 / 0.05);
  --shadow-lift: 0 0 0 1px oklch(19% 0.024 52 / 0.06), 0 14px 30px -18px oklch(19% 0.024 52 / 0.35);
  --shadow-sheet: 0 0 0 1px oklch(19% 0.024 52 / 0.07), 0 10px 24px -16px oklch(19% 0.024 52 / 0.3);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
  --font-body: var(--font);
  --text-xs: 12px; --text-sm: 14px; --text-md: 17px; --text-lg: 21px; --text-xl: 28px; --text-2xl: 40px;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 20px; --space-xl: 28px; --space-2xl: 52px; --space-3xl: 90px;
  --radius-xl: 28px; --radius-lg: 20px; --radius-md: 14px; --radius-pill: 9999px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 240ms; --dur-micro: 120ms;
  --container: 1440px; --gutter: 40px; --bar-h: 52px;
}
@media (max-width: 60rem) { :root { --gutter: 22px; } }
@media (max-width: 40rem) { :root { --gutter: 16px; --bar-h: 48px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scroll-padding-top: var(--space-3xl); scrollbar-color: var(--color-muted) var(--color-paper); }
::selection { background: var(--color-tile); color: var(--color-ink); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.47; letter-spacing: -0.016em; -webkit-font-smoothing: antialiased; touch-action: manipulation; caret-color: var(--color-ink); }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; color: var(--color-ink); overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }

/* nav */
.bar { position: sticky; top: 0; z-index: 20; height: var(--bar-h); background: var(--nav-glass); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px); box-shadow: 0 1px 0 var(--color-hairline); }
.bar-in { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
.bar-name { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: 0.012em; color: var(--color-ink); white-space: nowrap; }
.bar-count { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 var(--space-lg); border: 1px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur-micro) var(--ease); }
.btn:hover { background: var(--color-ink); color: var(--color-paper); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; transform: none; background: transparent; color: var(--color-ink); }
.btn[aria-busy="true"] { cursor: progress; }
.btn--quiet { border-color: var(--color-hairline); font-weight: 400; }
.btn--quiet:hover { border-color: var(--color-ink); }
.btn--small { min-height: 32px; padding: 0 var(--space-sm); font-size: var(--text-xs); position: relative; }
.btn--small::after { content: ""; position: absolute; inset: -6px 0; }
.btn--armed { background: var(--color-ink); color: var(--color-paper); }
.field { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; }
.field select { min-height: 40px; padding: 0 var(--space-xl) 0 var(--space-md); border: 1px solid var(--color-hairline); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink); font-size: var(--text-sm); cursor: pointer; transition: border-color var(--dur) var(--ease); }
.field select:hover { border-color: var(--color-ink); }
.field select:disabled { opacity: 0.5; cursor: not-allowed; }

/* empty state */
.empty { padding-block: var(--space-2xl); }
.drop { display: grid; justify-items: start; gap: var(--space-md); padding: var(--space-2xl) var(--space-xl); border-radius: var(--radius-xl); background: var(--color-band); transition: box-shadow var(--dur) var(--ease); }
.drop h2 { font-size: var(--text-2xl); line-height: 1.1; letter-spacing: -0.022em; }
.drop p { font-size: var(--text-lg); line-height: 1.4; max-width: 34em; }
.drop-actions { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xs); }
body.dragging .drop, body.dragging .sheets-band { box-shadow: inset 0 0 0 2px var(--color-ink); }
@media (max-width: 40rem) { .drop { padding: var(--space-xl) var(--space-lg); } .drop h2 { font-size: var(--text-xl); } .drop p { font-size: var(--text-md); } }

/* toolbar */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm) var(--space-md); padding-block: var(--space-lg) var(--space-sm); }
.tools-push { margin-left: auto; display: flex; flex-wrap: wrap; gap: var(--space-sm); }
.status { min-height: 1.47em; padding-bottom: var(--space-lg); font-size: var(--text-sm); color: var(--color-muted); }
.status strong { font-weight: 600; color: var(--color-ink); }
.status[data-tone="error"] { color: var(--color-ink); font-weight: 500; }
.meter { height: 3px; margin-bottom: var(--space-md); border-radius: var(--radius-pill); background: var(--color-tile); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--color-ink); transform-origin: left center; transform: scaleX(0); transition: transform var(--dur) linear; }
@media (max-width: 60rem) { .tools-push { margin-left: 0; } }

/* sheets */
.sheets-band { background: var(--color-band); padding-block: var(--space-xl) var(--space-2xl); transition: box-shadow var(--dur) var(--ease); }
.sheets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: var(--space-xl) var(--space-lg); }
.cell { min-width: 0; display: grid; gap: var(--space-xs); align-content: start; }
.cell-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-sm); min-height: 32px; }
.cell-name { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); }
.cell-mix { font-size: var(--text-xs); color: var(--color-muted); }
.cell-ctl { margin-left: auto; display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
.frame { display: flex; }
.frame--right { justify-content: flex-end; }
.sheet { position: relative; width: 100%; aspect-ratio: 2 / 1; background: var(--color-sheet); box-shadow: var(--shadow-sheet); overflow: hidden; }
.sheet--single { width: 50%; aspect-ratio: 1 / 1; }
.sheet::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--color-hairline); opacity: 0.6; pointer-events: none; }
.sheet--single::after { content: none; }
.ph { position: absolute; padding: 0; border: 0; border-radius: 0; background-color: var(--color-tile); background-size: cover; background-position: center; cursor: pointer; transition: opacity var(--dur) var(--ease); }
.ph:hover { opacity: 0.86; }
.ph:focus-visible { outline: 3px solid var(--color-ink); outline-offset: -3px; z-index: 2; }
.ph[aria-pressed="true"] { outline: 3px solid var(--color-ink); outline-offset: -3px; z-index: 2; opacity: 1; }
.ph.demo { display: grid; place-items: center; color: var(--color-demo-ink); font-size: var(--text-sm); font-weight: 600; }
.ph.demo[data-c="0"] { background-color: var(--color-demo-a); }
.ph.demo[data-c="1"] { background-color: var(--color-demo-b); }
.ph.demo[data-c="2"] { background-color: var(--color-demo-c); }
.ph.demo[data-c="3"] { background-color: var(--color-demo-d); }
.ph.low::before { content: "解析度偏低"; position: absolute; left: var(--space-xs); top: var(--space-xs); padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-xs); font-weight: 500; }

/* 範例 */
.examples { padding-block: var(--space-xs) var(--space-3xl); }
.examples h2 { font-size: var(--text-xl); margin-bottom: var(--space-lg); }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: var(--space-xl) var(--space-lg); }
.ex { min-width: 0; display: grid; gap: var(--space-xs); margin: 0; }
.ex-sheet { position: relative; aspect-ratio: 2 / 1; background: var(--color-sheet); box-shadow: var(--shadow-sheet); overflow: hidden; }
.ex-sheet::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--color-hairline); opacity: 0.6; }
.ex-sheet > i { position: absolute; background-size: 100% auto; background-repeat: no-repeat; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.ex-sheet > i[data-c="0"] { background-color: var(--color-demo-a); }
.ex-sheet > i[data-c="1"] { background-color: var(--color-demo-b); }
.ex-sheet > i[data-c="2"] { background-color: var(--color-demo-c); }
.ex-sheet > i[data-c="3"] { background-color: var(--color-demo-d); }
.ex-sheet > i[data-c="4"] { background-color: var(--color-demo-e); }
.ex-sheet > i[data-c="5"] { background-color: var(--color-demo-f); }
.ex figcaption { font-size: var(--text-xs); color: var(--color-muted); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
@media (hover: none) { .ph:hover { opacity: 1; } }
</style>
</head>
<body>
<header class="bar">
  <div class="container bar-in">
    <span class="bar-name">相本自動排版</span>
    <span class="bar-count num" id="count" aria-live="polite"></span>
  </div>
</header>
<main>
  <h1 class="visually-hidden">相本自動排版</h1>
  <input id="file" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple tabindex="-1" aria-hidden="true">

  <section id="empty" class="empty container" aria-label="放進照片">
    <div class="drop">
      <h2>把選好的照片拖進來</h2>
      <p>照你過去相本的排法自動排成跨頁：照片不裁切、白底、留一道細縫。排好直接輸出成 001、002-003 這樣命名的大圖，上傳就能下單。</p>
      <div class="drop-actions">
        <button class="btn" type="button" id="pick">選照片</button>
        <button class="btn btn--quiet" type="button" id="demo">先用色塊試排</button>
      </div>
    </div>
    <noscript><p>這個工具要開啟瀏覽器的 JavaScript 才能排版。</p></noscript>
  </section>

  <section id="work" aria-label="排版結果" hidden>
    <div class="container">
      <div class="tools">
        <label class="field">頁數
          <select id="pages"></select>
        </label>
        <label class="field">順序
          <select id="sort">
            <option value="name">照檔名</option>
            <option value="time">照拍攝時間</option>
          </select>
        </label>
        <label class="field">輸出尺寸
          <select id="size">
            <option value="4000">跨頁 8000 × 4000</option>
            <option value="3000">跨頁 6000 × 3000</option>
          </select>
        </label>
        <label class="field" id="how-field" hidden>存成
          <select id="how">
            <option value="dir">資料夾</option>
            <option value="zip">壓縮檔</option>
          </select>
        </label>
        <div class="tools-push">
          <button class="btn btn--quiet" type="button" id="clear">清空</button>
          <button class="btn btn--quiet" type="button" id="more">加照片</button>
          <button class="btn btn--quiet" type="button" id="again">重新排版</button>
          <button class="btn" type="button" id="export">輸出大圖</button>
        </div>
      </div>
      <div class="meter" id="meter" hidden><span></span></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="sheets-band">
      <div class="container">
        <div class="sheets" id="sheets"></div>
      </div>
    </div>
  </section>

  <section id="examples" class="examples container" aria-label="範例">
    <h2>範例</h2>
    <div class="ex-grid" id="ex-grid"></div>
  </section>
</main>
<script>
(() => {
  'use strict';
  if (window.top !== window.self) return;
  // ---------------------------------------------------------------------
  // 量出來的版面尺寸（以跨頁 8000 × 4000 像素為基準，1 公釐約 13 像素）
  const REF = { H: 4000, PW: 4000, g: 13, m: 188, mi: 150, insetY: 240, bleed: 39 };

  // 每種「橫 n 直 m」組合，過去實際用過的版型與次數
  // S：整個跨頁排成一排；PG：左右頁各一組。格子：P 直幅、L 橫幅、C 兩張橫幅上下疊
  const TPL = {
    L1P1: [{ w: 114, S: ['L', 'P'] }, { w: 87, S: ['P', 'L'] }, { w: 18, PG: [['P'], ['L']] }, { w: 8, PG: [['L'], ['P']] }],
    L0P2: [{ w: 149, S: ['P', 'P'] }, { w: 66, PG: [['P'], ['P']] }],
    L1P2: [{ w: 91, S: ['L', 'P', 'P'] }, { w: 82, S: ['P', 'P', 'L'] }, { w: 8, PG: [['P', 'P'], ['L']] }, { w: 3, PG: [['L'], ['P', 'P']] }, { w: 1, PG: [['P'], ['P', 'L']] }, { w: 1, S: ['P', 'L', 'P'] }],
    L0P3: [{ w: 71, PG: [['P'], ['P', 'P']] }, { w: 56, PG: [['P', 'P'], ['P']] }, { w: 52, S: ['P', 'P', 'P'] }],
    L2P0: [{ w: 152, S: ['L', 'L'] }, { w: 4, PG: [['L'], ['L']] }],
    L3P0: [{ w: 47, S: ['L', 'C'] }, { w: 31, S: ['C', 'L'] }, { w: 7, PG: [['L'], ['C']] }, { w: 5, PG: [['C'], ['L']] }],
    L4P0: [{ w: 52, S: ['C', 'C'] }, { w: 25, PG: [['C'], ['C']] }],
    L2P1: [{ w: 26, S: ['C', 'P'] }, { w: 14, S: ['P', 'C'] }, { w: 12, PG: [['P'], ['C']] }, { w: 8, PG: [['C'], ['P']] }, { w: 1, S: ['L', 'L', 'P'] }, { w: 1, S: ['P', 'L', 'L'] }],
    L0P4: [{ w: 26, S: ['P', 'P', 'P', 'P'] }, { w: 10, PG: [['P', 'P'], ['P', 'P']] }],
    L1P0: [{ w: 16, S: ['L'] }, { w: 5, S: ['L'], inset: true }],
    L2P2: [{ w: 7, PG: [['P', 'P'], ['C']] }, { w: 4, PG: [['C'], ['P', 'P']] }, { w: 4, S: ['C', 'P', 'P'] }, { w: 3, S: ['P', 'P', 'C'] }, { w: 1, PG: [['C', 'P'], ['P']] }, { w: 1, S: ['P', 'C', 'P'] }],
    L8P0: [{ w: 5, S: ['C', 'C', 'C', 'C'] }],
    L2P3: [{ w: 1, S: ['C', 'P', 'P', 'P'] }, { w: 1, S: ['P', 'C', 'P', 'P'] }, { w: 1, PG: [['P', 'P', 'P'], ['C']] }, { w: 1, S: ['P', 'L', 'L', 'P', 'P'] }],
    L4P2: [{ w: 1, S: ['C', 'C', 'P', 'P'] }, { w: 1, PG: [['C', 'C'], ['P', 'P']] }],
    L6P0: [{ w: 2, S: ['C', 'C', 'C'] }],
    L3P1: [{ w: 1, S: ['L', 'C', 'P'] }, { w: 1, S: ['C', 'P', 'L'] }],
    L4P1: [{ w: 1, S: ['C', 'P', 'C'] }],
    L6P1: [{ w: 1, S: ['C', 'C', 'C', 'P'] }],
    L5P2: [{ w: 1, PG: [['P', 'L', 'P'], ['C', 'C']] }],
    L5P1: [{ w: 1, PG: [['L', 'C'], ['P', 'C']] }]
  };
  const COMP_W = { L1P1: 227, L0P2: 215, L1P2: 186, L0P3: 179, L2P0: 156, L3P0: 90, L4P0: 77, L2P1: 62, L0P4: 36, L1P0: 21, L2P2: 20, L8P0: 5, L2P3: 4, L4P2: 2, L6P0: 2, L3P1: 2, L4P1: 1, L6P1: 1, L5P2: 1, L5P1: 1 };
  const PER_SPREAD = 2.65;
  const PRINT_WHITE = '#ffffff';   // 輸出的紙是純白，跟量到的檔案一致
  const MODES = ['A', 'B', 'C'];
  const MODE_NAME = { A: '靠外', B: '置中', C: '出血' };

  // ---------------------------------------------------------------------
  // 版面計算：每個節點的寬 = a × 高 + b
  const sum = (arr, f) => arr.reduce((s, v) => s + f(v), 0);
  const leaf = (ph) => ({ t: 'ph', ph, a: ph.ar, b: 0 });
  const rowOf = (kids) => ({ t: 'row', kids, a: sum(kids, (k) => k.a), b: sum(kids, (k) => k.b) + REF.g * (kids.length - 1) });
  const colOf = (kids) => { const a = 1 / sum(kids, (k) => 1 / k.a); return { t: 'col', kids, a, b: (sum(kids, (k) => k.b / k.a) - REF.g * (kids.length - 1)) * a }; };
  function place(node, x, y, h, out) {
    if (node.t === 'ph') { out.push({ ph: node.ph, x, y, w: node.a * h, h }); return; }
    if (node.t === 'row') { for (const k of node.kids) { place(k, x, y, h, out); x += k.a * h + k.b + REF.g; } return; }
    const w = node.a * h + node.b;
    for (const k of node.kids) { const hk = (w - k.b) / k.a; place(k, x, y, hk, out); y += hk + REF.g; }
  }
  function fit(node, box, ax, bleedSnap) {
    const hW = (box.w - node.b) / node.a;
    let h = Math.min(box.h, hW);
    // 只差一點點就滿版時（小於 3 公釐出血），直接放大到滿版，免得邊上留一條細白線
    if (bleedSnap) { if (hW < box.h && (box.h - hW) / 2 <= bleedSnap) h = box.h; else if (box.h < hW && (box.w - (node.a * box.h + node.b)) / 2 <= bleedSnap) h = hW; }
    const w = node.a * h + node.b;

  $('file').addEventListener('change', (e) => { const f = Array.from(e.target.files); e.target.value = ''; addFiles(f); });
  $('demo').addEventListener('click', addDemo);
  $('again').addEventListener('click', () => { S.seed++; autoLayout(); });
  $('pages').addEventListener('change', (e) => { S.pages = e.target.value === 'auto' ? 'auto' : +e.target.value; autoLayout(); });
  $('sort').addEventListener('change', (e) => { S.sort = e.target.value; autoLayout(); });
  $('size').addEventListener('change', () => render());
  let clearTimer = 0;
  $('clear').addEventListener('click', (e) => {
    const b = e.currentTarget;
    if (b.classList.contains('btn--armed')) { clearTimeout(clearTimer); b.classList.remove('btn--armed'); b.textContent = '清空'; resetAll(); $('work').hidden = true; $('empty').hidden = false; $('examples').hidden = false; $('count').textContent = ''; $('sheets').textContent = ''; return; }
    b.classList.add('btn--armed'); b.textContent = '確定清空？';
    clearTimer = setTimeout(() => { b.classList.remove('btn--armed'); b.textContent = '清空'; }, 3500);
  });

  // ---------------------------------------------------------------------
  // 輸出
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let i = 0; i < 8; i++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u8) => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  async function zipOf(files) {
    const enc = new TextEncoder(), parts = [], central = [], d = new Date();
    const dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    let off = 0;
    for (const f of files) {
      const data = new Uint8Array(await f.blob.arrayBuffer()), crc = crc32(data), name = enc.encode(f.name);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      parts.push(lh.buffer, name, f.blob);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
      central.push(ch.buffer, name); off += 30 + name.length + data.length;
    }
    const cd = sum(central, (p) => p.byteLength), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cd, true); end.setUint32(16, off, true);
    return new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
  }
  const tokenColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  async function drawSheet(sh, outH) {
    const k = outH / REF.H, W = Math.round((sh.single ? REF.PW : REF.PW * 2) * k), c = document.createElement('canvas');
    c.width = W; c.height = outH;
    const g = c.getContext('2d'); g.fillStyle = PRINT_WHITE; g.fillRect(0, 0, W, outH); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    for (const r of sh.rects) {
      const x = Math.round(r.x * k), y = Math.round(r.y * k), w = Math.round((r.x + r.w) * k) - x, h = Math.round((r.y + r.h) * k) - y;
      if (!r.ph.file) { g.fillStyle = tokenColor('--color-demo-' + 'abcd'[r.ph.tone]); g.fillRect(x, y, w, h); continue; }
      const bm = await createImageBitmap(r.ph.file, { imageOrientation: 'from-image' });
      const want = w / h; let sw = bm.width, shh = bm.height;
      if (sw / shh > want) sw = shh * want; else shh = sw / want;          // 只修掉四捨五入差的那一兩個像素，不算裁切
      g.drawImage(bm, (bm.width - sw) / 2, (bm.height - shh) / 2, sw, shh, x, y, w, h); bm.close();
    }
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.95));
    c.width = c.height = 0;
    return blob;
  }
  const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); };
  let capPromise = null;
  const inArtifact = () => !!(window.claude && typeof window.claude.use === 'function');
  const getCap = () => capPromise || (capPromise = inArtifact() ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null));
  const canPickDir = () => typeof window.showDirectoryPicker === 'function' && window.top === window.self;
  async function exportAll() {
    if (S.busy) return;
    const list = sheets(); if (!list.length) return;
    const outH = +$('size').value, folderName = '相本排版_' + stamp();
    let dir = null, cap = null;
    if (inArtifact()) { cap = await getCap(); if (!cap) { setStatus('這個檢視畫面不能存檔。請改用下載到電腦的那一份來輸出。', 'error'); return; } }
    else if (canPickDir() && $('how').value === 'dir') {
      try { const root = await window.showDirectoryPicker({ mode: 'readwrite' }); dir = await root.getDirectoryHandle(folderName, { create: true }); }
      catch (e) { if (e && e.name === 'AbortError') return; dir = null; }
    }
    setBusy(true); render();
    const files = [];
    try {
      for (let i = 0; i < list.length; i++) {
        const name = list[i].name + '.jpg';
        setStatus('輸出中 ' + (i + 1) + ' / ' + list.length + '：' + name); setMeter(i / list.length);
        const blob = await drawSheet(list[i], outH);
        if (dir) { const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(blob); await w.close(); }
        else files.push({ name, blob });
      }
      setMeter(1);
      if (dir) { finish('已把 ' + list.length + ' 個檔存進你選的資料夾裡的「' + folderName + '」。'); return; }
      setStatus('打包中'); const zip = await zipOf(files), zipName = folderName + '.zip';
      if (cap) { await cap.save({ filename: zipName, data: zip }); finish('已交給瀏覽器存檔：' + zipName + '，裡面有 ' + list.length + ' 個檔。'); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(zip); a.download = zipName; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      finish('已下載 ' + zipName + '，裡面有 ' + list.length + ' 個檔。');
    } catch (e) {
      const declined = e && e.code === 'declined';
      setBusy(false); setMeter(null); render(); setStatus(declined ? '你取消了存檔，沒有存任何東西。' : '輸出失敗：' + ((e && e.message) || '原因不明') + '。照片都還在，可以再按一次。', 'error');
    }
  }
  function finish(msg) { setBusy(false); setMeter(null); render(); setStatus(msg); }
  $('export').addEventListener('click', exportAll);
  if (canPickDir() && !inArtifact()) $('how-field').hidden = false;

  // ---------------------------------------------------------------------
  // 範例：用同一套版面計算畫出各種排法
  function fillExamples() {
    const list = [
      { c: 'LP', t: { S: ['L', 'P'] } }, { c: 'PPP', t: { PG: [['P'], ['P', 'P']] }, m: 'A' }, { c: 'LLLL', t: { S: ['C', 'C'] } }, { c: 'PP', t: { S: ['P', 'P'] } },
      { c: 'LLL', t: { S: ['L', 'C'] } }, { c: 'PL', t: { PG: [['P'], ['L']] }, m: 'A' }, { c: 'PPPP', t: { S: ['P', 'P', 'P', 'P'] } }, { c: 'LL', t: { S: ['L', 'L'] } },
      { c: 'LLLL', t: { PG: [['C'], ['C']] }, m: 'A' }, { c: 'PPL', t: { S: ['P', 'P', 'L'] } }, { c: 'PP', t: { PG: [['P'], ['P']] }, m: 'B' }, { c: 'LLP', t: { S: ['C', 'P'] } },
      { c: 'PPP', t: { S: ['P', 'P', 'P'] } }, { c: 'PPLL', t: { PG: [['P', 'P'], ['C']] }, m: 'A' }, { c: 'L', t: { S: ['L'] } }, { c: 'LLLLLLLL', t: { S: ['C', 'C', 'C', 'C'] } }
    ];
    // 範例照片取自「拍什麼都ok」相簿（imokahhhh.com/okcam），讀相簿同一批加密縮圖：[拼圖編號, 位置百分比, 長寬比]
    const EX_L = [["02", 0.0, 1.7808], ["02", 17.2233, 1.3333], ["07", 44.4607, 1.3333], ["11", 22.2222, 1.3648], ["21", 0.0, 1.3333], ["22", 11.4432, 1.3333], ["27", 44.0588, 1.3333], ["28", 76.6072, 1.5029]];
    const EX_P = [["02", 5.3914, 0.7504], ["07", 0.0, 0.8], ["11", 0.0, 0.7504], ["21", 6.5723, 0.7504], ["22", 0.0, 0.7504], ["27", 0.0, 0.7504], ["28", 0.0, 0.7504], ["02", 25.4441, 0.7376], ["07", 11.1397, 0.7504], ["11", 11.6962, 0.7504], ["21", 18.2508, 0.7504], ["22", 18.825, 0.7504], ["27", 11.7637, 0.7504], ["28", 10.9548, 0.7504], ["02", 38.1022, 0.8], ["07", 23.0163, 0.7504], ["11", 29.8228, 0.7504], ["21", 29.9292, 0.7504], ["22", 30.8708, 0.7504], ["27", 23.3569, 0.8], ["28", 21.9096, 0.7504], ["02", 50.4062, 0.7504], ["07", 34.8929, 0.7504], ["11", 41.519, 0.7504], ["21", 41.6077, 0.7504], ["22", 51.9555, 0.7504], ["27", 34.5612, 0.7504], ["28", 32.8644, 0.7504]];
    const host = $('ex-grid'); let n = 0, li = 0, pi = 0;
    for (const ex of list) {
      const photos = Array.from(ex.c, (ch) => { const s = ch === 'L' ? EX_L[li++ % EX_L.length] : EX_P[pi++ % EX_P.length]; return { cls: ch, ar: s[2], s }; });
      const fig = el('figure', 'ex'), sheet = el('div', 'ex-sheet');
      for (const r of layoutSpread(photos, ex.t, ex.m || 'A')) { const i = el('i'); i.dataset.c = (n++ * 5 + 2) % 6; i.dataset.s = r.ph.s[0]; i.style.backgroundPosition = '0 ' + r.ph.s[1] + '%'; i.style.left = (r.x / 8000 * 100) + '%'; i.style.top = (r.y / 4000 * 100) + '%'; i.style.width = (r.w / 8000 * 100) + '%'; i.style.height = (r.h / 4000 * 100) + '%'; sheet.append(i); }
      fig.append(sheet, el('figcaption', '', mixText(photos))); host.append(fig);
    }
    host.addEventListener('contextmenu', (e) => e.preventDefault());
    host.addEventListener('dragstart', (e) => e.preventDefault());
    // 解密相簿縮圖；讀不到就留著色塊
    const KA = [103, 233, 43, 212, 120, 125, 42, 143, 228, 105, 14, 212, 227, 89, 96, 52, 49, 183, 172, 126, 49, 99, 241, 48, 180, 157, 23, 118, 201, 80, 171, 243], KM = [169, 39, 176, 76, 11, 28, 181];
    if (!window.crypto || !crypto.subtle || location.protocol !== 'https:') return;
    const key = crypto.subtle.importKey('raw', new Uint8Array(KA.map((v, i) => v ^ KM[i % KM.length])), 'AES-GCM', false, ['decrypt']);
    for (const id of new Set(Array.from(host.querySelectorAll('i[data-s]'), (i) => i.dataset.s))) {
      fetch('/okcam/img/S/' + id + '.dat').then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(async (b) => URL.createObjectURL(new Blob([await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, await key, b.slice(12))], { type: 'image/webp' })))
        .then((u) => { for (const i of host.querySelectorAll('i[data-s="' + id + '"]')) i.style.backgroundImage = 'url("' + u + '")'; })
        .catch(() => {});
    }
  }
  fillExamples();
  fillPages(24);
})();
